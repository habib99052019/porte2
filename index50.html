<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Variables for easy customization - Enhanced colors */
        :root {
            --primary-bg: linear-gradient(135deg, #ff9a9e 0%, #fecfef 25%, #fecfef 50%, #a8edea 75%, #fed6e3 100%);
            --card-bg: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.3);
            --text-color: #ffffff;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            --modal-bg: rgba(0, 0, 0, 0.6);
            --accent-color: #ff6b6b;
            --secondary-accent: #4ecdc4;
            /* Button specific colors */
            --google-bg: rgba(66, 133, 244, 0.25);
            --google-hover: rgba(66, 133, 244, 0.4);
            --facebook-bg: rgba(59, 89, 152, 0.25);
            --facebook-hover: rgba(59, 89, 152, 0.4);
            --linkedin-bg: rgba(0, 119, 181, 0.25);
            --linkedin-hover: rgba(0, 119, 181, 0.4);
            --location-bg: rgba(255, 87, 34, 0.25);
            --location-hover: rgba(255, 87, 34, 0.4);
            --whatsapp-bg: rgba(37, 211, 102, 0.25);
            --whatsapp-hover: rgba(37, 211, 102, 0.4);
            --contact-bg: rgba(155, 89, 182, 0.25);
            --contact-hover: rgba(155, 89, 182, 0.4);
        }

        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: black;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Fullscreen container with enhanced animation */
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: slideUpFadeIn 1s ease-out forwards;
        }

        /* Profile section with slide-up */
        .profile {
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFadeIn 1s ease-out 0.3s forwards;
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--card-border);
            box-shadow: var(--shadow);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .profile img:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .name {
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFadeIn 1s ease-out 0.5s forwards;
        }

        .tagline {
            font-size: 16px;
            opacity: 0.8;
            margin-top: 5px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFadeIn 1s ease-out 0.7s forwards;
        }

        /* Card-style section with staggered animation */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: var(--shadow);
            transition: box-shadow 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFadeIn 1s ease-out 0.9s forwards;
        }

        .card:hover {
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
            transform: translateY(-5px);
        }

        /* Buttons with enhanced animations and unique colors */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
            color: var(--text-color);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFadeIn 1s ease-out 1.1s forwards;
        }

        .btn:nth-child(2) { animation-delay: 1.2s; }
        .btn:nth-child(3) { animation-delay: 1.3s; }
        .btn:nth-child(4) { animation-delay: 1.4s; }
        .btn:nth-child(5) { animation-delay: 1.5s; }
        .btn:nth-child(6) { animation-delay: 1.6s; }

        /* Specific button colors */
        .btn.google {
            background: var(--google-bg);
        }
        .btn.google:hover {
            background: var(--google-hover);
        }

        .btn.facebook {
            background: var(--facebook-bg);
        }
        .btn.facebook:hover {
            background: var(--facebook-hover);
        }

        .btn.linkedin {
            background: var(--linkedin-bg);
        }
        .btn.linkedin:hover {
            background: var(--linkedin-hover);
        }

        .btn.location {
            background: var(--location-bg);
        }
        .btn.location:hover {
            background: var(--location-hover);
        }

        .btn.whatsapp {
            background: var(--whatsapp-bg);
        }
        .btn.whatsapp:hover {
            background: var(--whatsapp-hover);
        }

        .btn.contact {
            background: var(--contact-bg);
        }
        .btn.contact:hover {
            background: var(--contact-hover);
        }

        .btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn i {
            margin-right: 10px;
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .btn:hover i {
            transform: rotate(10deg);
        }

        /* Modal with enhanced animation */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.4s ease-in-out;
        }

        .modal-content {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            max-width: 300px;
            width: 90%;
            text-align: center;
            transform: scale(0.8) rotate(-5deg);
            animation: scaleRotateIn 0.5s ease-out forwards;
        }

        .modal h2 {
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .social-icons {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .social-icons a {
            color: var(--text-color);
            font-size: 30px;
            transition: transform 0.4s ease, color 0.4s ease;
            position: relative;
        }

        .social-icons a:hover {
            transform: scale(1.3) translateY(-5px);
            color: var(--secondary-accent);
        }

        .social-icons a::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--accent-color);
            transform: translateX(-50%);
            transition: width 0.4s ease;
        }

        .social-icons a:hover::after {
            width: 100%;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .close-btn:hover {
            transform: rotate(90deg);
        }

        /* Keyframe animations */
        @keyframes slideUpFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleRotateIn {
            to {
                transform: scale(1) rotate(0deg);
            }
        }

        /* Mobile-first responsive */
        @media (min-width: 768px) {
            .container {
                max-width: 500px;
            }
            .profile img {
                width: 150px;
                height: 150px;
            }
            .name {
                font-size: 28px;
            }
            .tagline {
                font-size: 18px;
            }
            .btn {
                font-size: 18px;
                padding: 18px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="https://via.placeholder.com/120" alt="Profile Image">
            <div class="name">John Doe</div>
            <div class="tagline">Creative Designer & Developer</div>
        </div>
        <div class="card">
            <div class="buttons">
                <button class="btn google" onclick="openLink('https://www.google.com/search?q=reviews')">
                    <i class="fas fa-star"></i> Google Reviews
                </button>
                <button class="btn facebook" onclick="openLink('https://www.facebook.com/recommendations')">
                    <i class="fas fa-thumbs-up"></i> Facebook Recommendation
                </button>
                <button class="btn linkedin" onclick="openLink('https://www.linkedin.com/in/recommendations')">
                    <i class="fas fa-briefcase"></i> LinkedIn Recommendation
                </button>
                <button class="btn location" onclick="openLink('https://maps.google.com/?q=location')">
                    <i class="fas fa-map-marker-alt"></i> Our Location
                </button>
                <button class="btn whatsapp" onclick="openWhatsApp()">
                    <i class="fab fa-whatsapp"></i> Send WhatsApp Message
                </button>
                <button class="btn contact" onclick="openModal()">
                    <i class="fas fa-address-book"></i> Contact & Social Networks
                </button>
            </div>
        </div>
    </div>

    <!-- Modal for Contact & Social Networks -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2>Contact & Social Networks</h2>
            <div class="social-icons">
                <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://www.tiktok.com" target="_blank"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>
    </div>

    <script>
        // Function to open external links
        function openLink(url) {
            window.open(url, '_blank');
        }

        // Function to open WhatsApp with predefined message
        function openWhatsApp() {
            const phone = '+1234567890'; // Replace with actual phone number
            const message = 'Hello! I found your digital card.';
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        // Function to open modal
        function openModal() {
            document.getElementById('modal').style.display = 'flex';
        }

        // Function to close modal
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };
    </script>
</body>
</html>
