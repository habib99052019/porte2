<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Roulette Game</title>
    <style>
        /* CSS Variables for easy theming */
        :root {
            --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --neon-glow: 0 0 20px rgba(0, 255, 255, 0.5);
            --button-bg: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            --button-hover: linear-gradient(45deg, #ff5252, #45b7d1);
            --text-color: #ffffff;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: var(--primary-bg);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Glassmorphism Container */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
            max-width: 600px;
            width: 90%;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: var(--neon-glow);
        }

        /* Roulette Wheel */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 30px;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 4s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* Easing effect */
        }

        .segment {
            position: absolute;
            width: 50%;
            height: 50%;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
            transform-origin: 100% 100%;
        }

        .segment img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        /* Colors for segments (alternating) */
        .segment:nth-child(odd) { background: #ff6b6b; }
        .segment:nth-child(even) { background: #4ecdc4; }

        /* Pointer Arrow */
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #fff;
            z-index: 10;
        }

        /* Spin Button */
        .spin-btn {
            background: var(--button-bg);
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--neon-glow);
            margin-top: 20px;
        }

        .spin-btn:hover {
            background: var(--button-hover);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: var(--shadow);
            position: relative;
        }

        .modal img {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 2rem;
            color: var(--text-color);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .close-btn:hover {
            transform: scale(1.2);
        }

        /* Confetti Animation */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            animation: fall 3s linear infinite;
        }

        .confetti:nth-child(2n) { background: #4ecdc4; }
        .confetti:nth-child(3n) { background: #ffe66d; }

        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 2rem;
            }
            .wheel-container {
                width: 250px;
                height: 250px;
            }
            .segment img {
                width: 50px;
                height: 50px;
            }
        }

        @media (max-width: 480px) {
            .wheel-container {
                width: 200px;
                height: 200px;
            }
            .segment img {
                width: 40px;
                height: 40px;
            }
            .spin-btn {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spin to Win!</h1>
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <!-- Segments with prizes -->
                <div class="segment" style="transform: rotate(0deg);"><img src="https://via.placeholder.com/60x60?text=Smartphone" alt="Smartphone"></div>
                <div class="segment" style="transform: rotate(45deg);"><img src="https://via.placeholder.com/60x60?text=Headphones" alt="Headphones"></div>
                <div class="segment" style="transform: rotate(90deg);"><img src="https://via.placeholder.com/60x60?text=Smartwatch" alt="Smartwatch"></div>
                <div class="segment" style="transform: rotate(135deg);"><img src="https://via.placeholder.com/60x60?text=Coupon" alt="Discount Coupon"></div>
                <div class="segment" style="transform: rotate(180deg);"><img src="https://via.placeholder.com/60x60?text=Subscription" alt="Free Subscription"></div>
                <div class="segment" style="transform: rotate(225deg);"><img src="https://via.placeholder.com/60x60?text=Gift+Card" alt="Gift Card"></div>
                <div class="segment" style="transform: rotate(270deg);"><img src="https://via.placeholder.com/60x60?text=Laptop" alt="Laptop"></div>
                <div class="segment" style="transform: rotate(315deg);"><img src="https://via.placeholder.com/60x60?text=Mystery+Box" alt="Mystery Box"></div>
            </div>
        </div>
        <button class="spin-btn" id="spinBtn">Spin the Wheel!</button>
    </div>

    <!-- Modal for winning -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeBtn">&times;</button>
            <img id="winImage" src="" alt="Winning Prize">
            <h2>Congratulations!</h2>
            <p>You won: <span id="winText"></span></p>
        </div>
    </div>

    <script>
        // JavaScript for Roulette Game

        // Elements
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const modal = document.getElementById('modal');
        const closeBtn = document.getElementById('closeBtn');
        const winImage = document.getElementById('winImage');
        const winText = document.getElementById('winText');

        // Prizes array (matching the segments)
        const prizes = [
            { name: 'Smartphone', img: 'https://via.placeholder.com/150x150?text=Smartphone' },
            { name: 'Headphones', img: 'https://via.placeholder.com/150x150?text=Headphones' },
            { name: 'Smartwatch', img: 'https://via.placeholder.com/150x150?text=Smartwatch' },
            { name: 'Discount Coupon', img: 'https://via.placeholder.com/150x150?text=Coupon' },
            { name: 'Free Subscription', img: 'https://via.placeholder.com/150x150?text=Subscription' },
            { name: 'Gift Card', img: 'https://via.placeholder.com/150x150?text=Gift+Card' },
            { name: 'Laptop', img: 'https://via.placeholder.com/150x150?text=Laptop' },
            { name: 'Mystery Box', img: 'https://via.placeholder.com/150x150?text=Mystery+Box' }
        ];

        // Spin function
        function spinWheel() {
            // Disable button during spin
            spinBtn.disabled = true;

            // Play spin sound (subtle beep)
            playSound('spin');

            // Random winning index
            const winIndex = Math.floor(Math.random() * prizes.length);

            // Calculate rotation: multiple full spins + angle to win segment
            const spins = 5 + Math.random() * 5; // 5-10 full spins
            const anglePerSegment = 360 / prizes.length;
            const winAngle = winIndex * anglePerSegment;
            const totalRotation = spins * 360 + (360 - winAngle); // Adjust to land on pointer

            // Apply rotation
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            // After animation, show modal
            setTimeout(() => {
                showWinModal(winIndex);
                spinBtn.disabled = false;
            }, 4000); // Match animation duration
        }

        // Show winning modal
        function showWinModal(index) {
            const prize = prizes[index];
            winImage.src = prize.img;
            winText.textContent = prize.name;
            modal.style.display = 'flex';

            // Trigger confetti
            createConfetti();
        }

        // Close modal
        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
            // Reset wheel rotation
            wheel.style.transform = 'rotate(0deg)';
        });

        // Spin button event
        spinBtn.addEventListener('click', spinWheel);

        // Simple sound function (using Web Audio API for clean implementation)
        function playSound(type) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (type === 'spin') {
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            }
        }

        // Create confetti animation
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(confetti);

                // Remove after animation
                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }
    </script>
</body>
</html>
