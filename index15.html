<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Partager sur Facebook</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-bottom: 15px;
      padding: 10px;
      resize: none;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      background: #1877f2;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #145dbf;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>Créer un post Facebook</h3>

    <textarea id="postText">
Bonjour @Nom Prenom 👋
Je vous recommande cette page 🔥
    </textarea>

    <button onclick="shareFacebook()">Partager sur Facebook</button>
  </div>

  <script>
    function shareFacebook() {
      const text = document.getElementById("postText").value;
      const urlToShare = "https://www.facebook.com/AsfourSer/videos/1362197065079668"; // 🔁 change ici

      const fbUrl =
        "https://www.facebook.com/sharer/sharer.php?u=" +
        encodeURIComponent(urlToShare) +
        "&quote=" +
        encodeURIComponent(text);

      window.open(fbUrl, "_blank", "width=600,height=400");
    }
  </script>

</body>
</html>
