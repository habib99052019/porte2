<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Card - Dr. Emily Carter</title>
    <!-- Google Fonts: Inter and Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- AOS.js for animations -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); /* Soft gradient background */
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1, h2, h3 {
            font-family: 'Poppins', sans-serif;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* Contact Card */
        .contact-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .contact-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .contact-card h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .contact-card p {
            font-size: 1rem;
            margin-bottom: 30px;
            color: #7f8c8d;
        }

        /* Social Buttons */
        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn i {
            margin-right: 10px;
            font-size: 1.2rem;
        }
        .btn-facebook {
            background: #1877f2;
            color: white;
        }
        .btn-facebook:hover {
            background: #166fe5;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.4);
        }
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }
        .btn-instagram:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(228, 104, 60, 0.4);
        }
        .btn-tiktok {
            background: #000000;
            color: white;
        }
        .btn-tiktok:hover {
            background: #333333;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        .btn-whatsapp {
            background: #25d366;
            color: white;
        }
        .btn-whatsapp:hover {
            background: #128c7e;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #25d366;
            color: white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        /* Responsive Design (Mobile-first) */
        @media (max-width: 480px) {
            .contact-card {
                padding: 30px 20px;
            }
            .profile-img {
                width: 100px;
                height: 100px;
            }
            .contact-card h1 {
                font-size: 1.5rem;
            }
            .btn {
                padding: 12px 18px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Contact Card -->
    <div class="contact-card" data-aos="zoom-in">
        <img src="https://via.placeholder.com/120" alt="Dr. Emily Carter" class="profile-img">
        <h1>Dr. Emily Carter</h1>
        <p>Family Medicine Specialist<br>Caring for Your Health with Compassion</p>
        <div class="social-buttons">
            <a href="https://www.facebook.com/yourprofile" target="_blank" class="btn btn-facebook">
                <i class="fab fa-facebook"></i> Follow
            </a>
            <a href="https://www.instagram.com/yourprofile" target="_blank" class="btn btn-instagram">
                <i class="fab fa-instagram"></i> Follow
            </a>
            <a href="https://www.tiktok.com/@yourprofile" target="_blank" class="btn btn-tiktok">
                <i class="fab fa-tiktok"></i> Follow
            </a>
            <a href="https://wa.me/1234567890" target="_blank" class="btn btn-whatsapp">
                <i class="fab fa-whatsapp"></i> Chat
            </a>
        </div>
    </div>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/1234567890" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- AOS.js Initialization -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true
        });
    </script>
</body>
</html>
