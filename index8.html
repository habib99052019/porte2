<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partager sur Facebook</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f0f0f0;
  }
  .share-container {
    text-align: center;
    background: #fff;
    padding: 20px 40px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  button {
    background-color: #1877F2;
    color: #fff;
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.3s;
  }
  button:hover {
    background-color: #145dbf;
  }
  img {
    max-width: 100%;
    border-radius: 5px;
    margin-bottom: 15px;
  }
</style>
</head>
<body>

<div class="share-container">
  <img id="image" src="https://scontent.ftun10-2.fna.fbcdn.net/v/t39.30808-1/476247891_588065853990717_5010367941545574603_n.jpg?stp=dst-jpg_s200x200_tt6&_nc_cat=103&ccb=1-7&_nc_sid=2d3e12&_nc_ohc=3gXBWVgl71wQ7kNvwGqVc6-&_nc_oc=Adm0yiiBiyjoqqF7aOAp36fA1mFGqRIjxeMo2NpvZfy-noIL5huFUZ3fvyzgimN5K6A&_nc_zt=24&_nc_ht=scontent.ftun10-2.fna&_nc_gid=BOAtzgibZQG_Dj5amcNfnw&oh=00_Afueve7COGXbueEzAY8echci9ws7eyBSHsB6iTd7m3I2Hw&oe=69871B3C" alt="Image à partager">
  <p id="text">Voici un texte que je veux partager sur Facebook !</p>
  <button id="shareBtn">Partager sur Facebook</button>
</div>

<script>
  const shareBtn = document.getElementById('shareBtn');
  shareBtn.addEventListener('click', () => {
    const imageUrl = document.getElementById('image').src;
    const text = encodeURIComponent(document.getElementById('text').innerText);
    https://www.facebook.com/sharer/sharer.php?u=URL_DE_VOTRE_PAGE.
    // URL de partage Facebook
    const facebookShareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(imageUrl)}&quote=${text}`;
    
    // Ouvrir le partage dans une nouvelle fenêtre
    window.open(facebookShareUrl, '_blank', 'width=600,height=400');
  });
</script>

</body>
</html>
